<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xóc đĩa Analytics</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');

    body {
      font-family: 'Inter', sans-serif;
      background: #020617;
      color: #f8fafc;
    }

    .custom-scrollbar::-webkit-scrollbar {
      height: 6px;
      width: 6px;
    }

    .custom-scrollbar::-webkit-scrollbar-track {
      background: #1e293b;
      border-radius: 10px;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #475569;
      border-radius: 10px;
    }

    .roadmap-viewport {
      background-color: #0f172a;
      background-image:
        linear-gradient(#1e293b 1px, transparent 1px),
        linear-gradient(90deg, #1e293b 1px, transparent 1px);
      background-size: 34px 34px;
      border: 1px solid #334155;
      border-radius: 12px;
      position: relative;
    }

    .roadmap-container {
      display: grid;
      grid-template-rows: repeat(6, 30px);
      grid-auto-columns: 30px;
      gap: 4px;
      padding: 0;
      min-height: 200px;
    }

    .cell {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 900;
      cursor: default;
      transition: transform 0.2s;
      z-index: 10;
    }

    .cell-chan {
      background: #ffffff;
      color: #000;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.15);
      border: 2px solid #cbd5e1;
    }

    .cell-le {
      background: #ef4444;
      color: #fff;
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.15);
      border: 2px solid #b91c1c;
    }

    .stat-card {
      background: linear-gradient(145deg, #1e293b, #0f172a);
      border: 1px solid #334155;
    }

    .progress-bar {
      height: 8px;
      border-radius: 4px;
      background: #334155;
      overflow: hidden;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
      border: 1px solid rgba(0, 0, 0, 0.1);
    }

    .dot-red {
      background-color: #ef4444;
    }

    .dot-white {
      background-color: #ffffff;
    }

    input[type="datetime-local"]::-webkit-calendar-picker-indicator {
      filter: invert(1);
    }
  </style>
</head>

<body class="p-4 md:p-8">

  <div class="max-w-7xl mx-auto space-y-6">
    <!-- Header -->
    <div
      class="flex flex-col xl:flex-row justify-between items-center bg-slate-900/90 p-6 rounded-2xl border border-slate-800 shadow-xl gap-6">
      <div class="flex items-center gap-4 shrink-0">
        <div class="bg-emerald-500 p-2 rounded-lg shadow-lg shadow-emerald-500/20">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24"
            stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />
          </svg>
        </div>
        <div>
          <h1 class="text-xl font-black text-white tracking-tighter uppercase">Xóc Đĩa Analytics <span
              class="text-emerald-400">Pro</span></h1>
          <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest text-nowrap">Bộ lọc thời gian chi
            tiết</p>
        </div>
      </div>

      <div class="flex flex-wrap gap-4 items-end justify-center">
        <div class="flex flex-col gap-1">
          <label class="text-[10px] font-bold text-slate-500 uppercase">Từ (From)</label>
          <input type="datetime-local" id="fromDate" step="1"
            class="bg-slate-800 border border-slate-700 text-xs rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-emerald-500 text-white font-mono">
        </div>
        <div class="flex flex-col gap-1">
          <label class="text-[10px] font-bold text-slate-500 uppercase">Đến (To)</label>
          <input type="datetime-local" id="toDate" step="1"
            class="bg-slate-800 border border-slate-700 text-xs rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-emerald-500 text-white font-mono">
        </div>
        <button id="applyBtn"
          class="bg-emerald-600 hover:bg-emerald-500 text-white px-8 py-2 rounded-lg text-xs font-black transition-all active:scale-95 shadow-lg shadow-emerald-900/30 h-[34px]">
          ÁP DỤNG BỘ LỌC
        </button>
        <button id="resetBtn" title="Bật/tắt auto-follow khoảng thời gian mới nhất"
          class="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-lg text-xs font-black transition-all active:scale-95 border border-slate-700 h-[34px]">
          <span id="followLabel">AUTO</span>
        </button>
      </div>
    </div>

    <!-- Tỉ lệ tổng quát -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
      <!-- Chẵn Lẻ Chính -->
      <div class="lg:col-span-3 stat-card p-6 rounded-2xl border-l-4 border-l-white">
        <div class="flex justify-between items-center mb-6">
          <h3 class="text-slate-400 text-[10px] font-black uppercase tracking-widest">Tỉ lệ Chẵn / Lẻ</h3>
          <span class="text-[10px] bg-slate-800 text-slate-400 px-2 py-0.5 rounded" id="totalRounds">0 phiên</span>
        </div>
        <div id="mainStats" class="space-y-6">
          <!-- Progress bars rendered here -->
        </div>
      </div>

      <!-- Tỉ lệ Vị Chi Tiết -->
      <div class="lg:col-span-9 stat-card p-6 rounded-2xl border-l-4 border-l-emerald-500">
        <h3 class="text-slate-400 text-[10px] font-black uppercase tracking-widest mb-6">Tỉ lệ vị chi tiết</h3>
        <div id="viStats" class="grid grid-cols-1 sm:grid-cols-5 gap-3">
          <!-- Cards with mini circles rendered here -->
        </div>
      </div>
    </div>

    <!-- Big Road -->
    <div class="stat-card rounded-2xl overflow-hidden shadow-2xl">
      <div class="px-6 py-4 border-b border-slate-800 bg-slate-900/50 flex justify-between items-center">
        <h3 class="text-xs font-black uppercase tracking-widest text-slate-400 flex items-center gap-2">
          <span class="w-1.5 h-4 bg-emerald-500 rounded-full"></span>
          Bảng cầu Big Road (6 hàng)
        </h3>
        <div class="flex gap-4 text-[10px] font-black">
          <div class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-white"></span> CHẴN</div>
          <div class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-red-500"></span> LẺ</div>
        </div>
      </div>
      <div class="overflow-x-auto custom-scrollbar roadmap-viewport p-1" id="roadmapScroll">
        <div id="roadmap" class="roadmap-container">
          <!-- Cells positioned by CSS Grid -->
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="flex flex-col md:flex-row gap-4 items-center justify-between text-[10px] font-mono text-slate-500 px-2">
      <div id="statusLine">Đang tải dữ liệu...</div>
      <div class="flex gap-4">
        <span id="liveBadge" class="text-emerald-500 font-bold uppercase tracking-widest animate-pulse">● System Online</span>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>

</html>
