path: dataset
train: images/train
val: images/val

# 15-class schema for single-stage YOLOv8 detector.
# Text cells (percent/total_bet/total_count) use generic classes and are
# mapped to specific bet types (chan/le/4r/4w/3w1r/3r1w) downstream via
# geometric matching against the area_* anchors in pipeline.py.
#
# round_id and new_round were removed: round boundaries are detected from
# the state machine (timer >= 46 resets a round, dice_* finalises it).
names:
  # 0) State
  0: timer               # countdown in center disc (white, turns red when <=10s)

  # 1) Betting areas (6 colored anchors used to map text cells)
  1: area_chan           # orange
  2: area_le             # green
  3: area_4_red          # cyan
  4: area_3w_1r          # blue
  5: area_3r_1w          # pink
  6: area_4_white        # purple

  # 2) Dice result (only visible when bowl opens)
  7: dice_4r
  8: dice_4w
  9: dice_3w1r
  10: dice_3r1w
  11: dice_2w2r

  # 3) Generic text cells (up to 6 instances each per frame)
  12: percent_cell       # history % row cells in top scoreboard
  13: total_bet_cell     # yellow total-money text (e.g. 7.47M)
  14: total_count_cell   # white player-count text (e.g. 299)
